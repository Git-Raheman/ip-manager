# ==============================================================================
# 🌐 Enterprise IP Manager v2 — Standalone Quick Deployment
# ==============================================================================
# 🚀 1-COMMAND QUICK START:
#    docker compose up -d
#
# 📌 What this does:
#    - Automatically pulls pre-built Docker Hub images
#    - Runs both PostgreSQL 16 database and the IP Manager web application
#    - Completely self-contained: No .env file required!
#    - Access in browser: http://localhost:3000
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 🖥️ Application Server (Frontend + Express API Server)
  # Pre-built Docker Hub Image: dockeraheman/ip_manager_v2_app
  # ----------------------------------------------------------------------------
  ip-manager-app:
    image: dockeraheman/ip_manager_v2_app:v2.1.0
    container_name: ip-manager-app
    restart: unless-stopped

    # --------------------------------------------------------------------------
    # 🔌 PORT CONFIGURATION:
    # Format: "HOST_PORT:CONTAINER_PORT"
    # - Default: "3000:80" -> Open http://localhost:3000 in your browser
    # - If port 3000 is already used on your machine, you can change this to:
    #   "8080:80" or "3001:80"
    # --------------------------------------------------------------------------
    ports:
      - "3000:80"

    # Ensure database is healthy before starting the app
    depends_on:
      ip-manager-db:
        condition: service_healthy

    # --------------------------------------------------------------------------
    # ⚙️ APPLICATION ENVIRONMENT:
    # - DATABASE_URL format: postgresql://<USER>:<PASSWORD>@<HOST>:<PORT>/<DATABASE>
    # - If you change POSTGRES_USER or POSTGRES_PASSWORD in ip-manager-db below,
    #   make sure to update them in DATABASE_URL here as well!
    # --------------------------------------------------------------------------
    environment:
      - NODE_ENV=production
      - APP_PORT=80
      - DATABASE_URL=postgresql://ip_manager_admin:ip_manager_secure_password_2026@ip-manager-db:5432/ip_manager_db
      - DATA_DIR=/app/data

    # Persistent storage for local file fallback & data exports
    volumes:
      - ip_manager_app_data:/app/data

    networks:
      - ip-manager-network

    # Healthcheck to verify the web app is running properly
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:80/api/health > /dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 🗄️ Relational Database Server (PostgreSQL)
  # Pre-built Docker Hub Image: dockeraheman/ip_manager_v2_db
  # ----------------------------------------------------------------------------
  ip-manager-db:
    image: dockeraheman/ip_manager_v2_db:v2.1.0
    container_name: ip-manager-db
    restart: unless-stopped

    # --------------------------------------------------------------------------
    # 🔐 DATABASE CREDENTIALS:
    # You can customize your database username, password, or database name here.
    # (Remember to update DATABASE_URL in ip-manager-app above if you change these!)
    # --------------------------------------------------------------------------
    environment:
      - POSTGRES_USER=ip_manager_admin
      - POSTGRES_PASSWORD=ip_manager_secure_password_2026
      - POSTGRES_DB=ip_manager_db

    # Persistent PostgreSQL database volume (preserves your IP records & subnets)
    volumes:
      - ip_manager_db_data:/var/lib/postgresql/data

    networks:
      - ip-manager-network

    # Healthcheck to verify database is ready to accept connections
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ip_manager_admin -d ip_manager_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s

# ==============================================================================
# 💾 PERSISTENT DATA VOLUMES
# Data is safely preserved even if you stop or restart the containers.
# ==============================================================================
volumes:
  ip_manager_db_data:
    name: ip_manager_db_data
  ip_manager_app_data:
    name: ip_manager_app_data

# ==============================================================================
# 🌐 INTERNAL NETWORK
# Enables private, secure communication between application and database.
# ==============================================================================
networks:
  ip-manager-network:
    name: ip-manager-network
    driver: bridge
